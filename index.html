<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>신성대학교 학사일정</title>
<link rel="icon" type="image/png" href="assets/ci-emblem-64.png">
<link rel="apple-touch-icon" href="assets/ci-emblem-256.png">
<style>
  :root{
    --bg:#f3f5f8; --surface:#ffffff; --line:#dde3ea; --line-strong:#aab4c0;
    --text:#1b2330; --muted:#5b6675; --faint:#8b95a3;
    --brand:#0b62c4; --brand-dark:#084b97; --brand-soft:#e4effc;
    --hol:#c9302a; --hol-bg:#fdecec;
    --term:#1e7a2a; --term-bg:#e4f4e2;
    --exam:#0e7fa3; --exam-bg:#def0f8;
    --event:#b06008; --event-bg:#fdf0da;
    --mk:#7a2f96; --mk-bg:#f3e8fa;
    --adm:#44546a;
    --sun:#c9302a; --sat:#1b6ec2;
    --head-bg:#ffe680;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,
                BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .icon{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;
        stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;flex:0 0 auto}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;
    padding:0 max(18px,env(safe-area-inset-left));
    display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(10,40,80,.18);
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px;padding:10px 0}
  .topbar .brand .icon{font-size:22px}
  .topbar .brand .ci-em{width:34px;height:34px;flex:none;background:#fff;border-radius:50%;padding:1px}
  .topbar .brand .ci-wm{height:26px;width:auto;flex:none}
  .topbar .brand .ci-sep{width:1px;height:20px;background:rgba(255,255,255,.45);margin:0 2px}
  @media (max-width:520px){.topbar .brand .ci-wm,.topbar .brand .ci-sep{display:none}.topbar .brand .ci-tx::before{content:"신성대학교 "}}
  @media (max-width:520px){.tabs{width:100%}.tabs button{flex:1;justify-content:center;white-space:nowrap;padding:9px 6px;font-size:13px;gap:5px}}

  .topbar .spacer{flex:1}
  .tabs{display:flex;gap:4px;padding:8px 0}
  .tabs button{
    border:0;background:rgba(255,255,255,.14);color:#e6f0fb;cursor:pointer;
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;
    display:inline-flex;align-items:center;gap:7px;transition:background .12s;
  }
  .tabs button:hover{background:rgba(255,255,255,.26)}
  .tabs button.on{background:#fff;color:var(--brand-dark)}
  .btnprint{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;
    padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:700;font-family:inherit;
    display:inline-flex;align-items:center;gap:7px}
  .btnprint:hover{background:rgba(255,255,255,.15)}

  .wrap{max-width:1200px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom, 0px))}

  /* ---------- hero (연도 + 학기 요약) ---------- */
  .yearnav{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 4px}
  .yearnav h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.8px;text-align:center}
  .yearnav .arrow{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);
    color:var(--brand);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s;
  }
  .yearnav .arrow:hover{background:var(--brand-soft);border-color:var(--brand)}
  .yearnav .arrow:disabled{opacity:.3;cursor:default}
  .yearnav select{
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:8px 12px;border-radius:9px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .srcline{text-align:center;font-size:12.5px;color:var(--faint);margin-bottom:16px}
  .srcline b{color:var(--muted)}
  .srcline .syncbtn{margin-left:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;vertical-align:1px}
  .srcline .syncbtn:hover{border-color:var(--brand);color:var(--brand)}
  .srcline .syncbtn:disabled{opacity:.5;cursor:default}

  /* 관리자 게시 배너 (아티팩트에서 소유자에게만 의미 있음) */
  .pubbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    margin:0 0 16px;padding:11px 16px;border:1.5px solid #d8a23f;background:#fdf4e3;
    border-radius:11px;font-size:13.5px;font-weight:700;color:#8a5a12}
  .pubbar.ok{border-color:var(--term);background:var(--term-bg);color:var(--term)}
  .pubbar.err{border-color:var(--hol);background:var(--hol-bg);color:var(--hol)}
  .pubbar button{border:0;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:800}
  .pubbar button:hover{background:var(--brand-dark)}
  .pubbar button:disabled{opacity:.5;cursor:default}

  /* ---------- 우선 표시 안내 배너 (시트 [우선표시] 행) ---------- */
  .priobar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    background:var(--brand-soft);border:1.5px solid var(--brand);color:var(--brand-dark);
    border-radius:12px;padding:10px 16px;margin:0 0 14px;font-size:13.5px;font-weight:700}
  .priobar button{border:0;border-radius:9px;background:var(--brand);color:#fff;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:800;padding:7px 14px}
  .priobar button:hover{background:var(--brand-dark)}

  /* ---------- 학사일정 검색 ---------- */
  .searchbar{position:relative;max-width:560px;margin:0 auto 14px}
  .searchbar .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  .searchbar input{width:100%;box-sizing:border-box;padding:10px 14px 10px 36px;border:1.5px solid var(--line-strong);
    border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface)}
  .searchbar input:focus{outline:none;border-color:var(--brand)}
  .sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);
    border:1.5px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);
    max-height:340px;overflow:auto;padding:6px}
  .sres .srow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;
    font-family:inherit;font-size:13.5px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .sres .srow:hover{background:var(--brand-soft)}
  .sres .sy{flex:0 0 auto;font-size:11.5px;font-weight:900;color:var(--brand-dark);background:var(--brand-soft);
    border-radius:6px;padding:2px 7px}
  .sres .sd{flex:0 0 auto;font-weight:800;color:var(--brand-dark);min-width:86px}
  .sres .snm{flex:1 1 auto;font-weight:700}
  .sres .sk{flex:0 0 auto;margin-left:auto;font-size:11.5px;color:var(--faint)}
  .sres .none{padding:10px;text-align:center}
  table.cal td.hl{outline:2.5px dashed var(--exam);outline-offset:-2.5px;border-radius:4px}

  .semcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
  @media (max-width:860px){.semcards{grid-template-columns:1fr}}
  .semcard{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;overflow:hidden}
  .semcard .sh{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--brand);color:#fff}
  .semcard .sh h2{margin:0;font-size:16px;font-weight:800}
  .semcard .sh .period{margin-left:auto;font-size:13px;color:#d7e9fb;font-weight:600}
  .semcard .sb{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
  .semcard .cell{padding:13px 10px;text-align:center;border-right:1px solid var(--line)}
  .semcard .cell:last-child{border-right:0}
  .semcard .cell .k{font-size:12px;color:var(--muted);font-weight:700}
  .semcard .cell .v{font-size:21px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
  .semcard .cell .v small{font-size:12px;font-weight:700;color:var(--muted)}
  .semcard .cell.start .v{color:var(--term)}
  .semcard .cell.end .v{color:var(--brand-dark)}
  .semcard .qline{display:flex;flex-wrap:wrap;gap:7px 14px;padding:11px 18px;font-size:13px;color:var(--muted);background:#fafbfd}
  .semcard .qline b{color:var(--term);font-weight:800}

  /* 다가오는 일정 */
  .upcoming{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;
    padding:13px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .upcoming .ut{font-size:13.5px;font-weight:800;color:var(--brand-dark);display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .upcoming .chips{display:flex;gap:8px;flex-wrap:wrap}
  .uchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;
    font-size:13px;font-weight:700;border:1.5px solid var(--line)}
  .uchip .dd{font-size:11.5px;font-weight:900;padding:2px 7px;border-radius:6px;background:var(--brand);color:#fff}
  .uchip.hol{background:var(--hol-bg);color:var(--hol);border-color:#f0c3c1}
  .uchip.term{background:var(--term-bg);color:var(--term);border-color:#b9dfb4}
  .uchip.exam{background:var(--exam-bg);color:var(--exam);border-color:#b5dcec}
  .uchip.event{background:var(--event-bg);color:var(--event);border-color:#f0d5a8}
  .uchip.mk{background:var(--mk);color:#fff;border-color:var(--mk)}
  .uchip.mk .dd{background:#fff;color:var(--mk)}
  .uchip.adm{background:#eef1f5;color:var(--adm);border-color:#c8d0da}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:14px 18px;flex-wrap:wrap;margin:0 0 14px;font-size:13px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid}
  .legend .lgnote{font-weight:500;padding-left:12px;border-left:1px solid var(--border-strong,#c8d0da)}
  .legend .lgnote b{font-weight:700}

  /* ---------- month calendar ---------- */
  .months{display:grid;grid-template-columns:1fr;gap:18px}
  .monthnav{position:sticky;top:var(--tbh,58px);z-index:25;display:flex;gap:6px;flex-wrap:wrap;
    background:var(--bg);padding:10px 0 8px;margin:0 0 10px;border-bottom:1.5px solid var(--line)}
  .monthnav button{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;
    padding:6px 13px;font:inherit;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
  .monthnav button:hover{border-color:var(--brand);color:var(--brand)}
  .monthnav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .month[id]{scroll-margin-top:calc(var(--tbh,58px) + var(--mnh,52px) + 8px)}
  @media (min-width:881px){
    table.cal td{height:82px}
    table.cal td .n{font-size:14.5px}
    table.cal td .lbl{font-size:11.5px}
  }
  .month{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;overflow:hidden;
    display:flex;flex-direction:column}
  .month .mh{padding:10px 15px;font-weight:900;font-size:16px;background:var(--brand);color:#fff;
    display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
  table.cal{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
  table.cal th{padding:8px 0;font-size:12px;font-weight:800;color:var(--muted);
    border-bottom:1.5px solid var(--line-strong);background:#fbfcfe}
  table.cal th.sun,table.cal td.sun .n{color:var(--sun)}
  table.cal th.sat,table.cal td.sat .n{color:var(--sat)}
  table.cal td{height:64px;vertical-align:top;padding:5px 6px;border:1px solid var(--line)}
  table.cal td .n{font-weight:800;font-size:13.5px}
  table.cal td .lbl{display:block;font-size:10.5px;line-height:1.25;margin-top:2px;font-weight:700;word-break:keep-all}
  table.cal td.ho{background:var(--hol-bg)}
  table.cal td.ho .n,table.cal td.ho .lbl{color:var(--hol)}
  table.cal td.term{background:var(--term-bg)}
  table.cal td.term .n,table.cal td.term .lbl{color:var(--term)}
  table.cal td.exam{background:var(--exam-bg)}
  table.cal td.exam .n,table.cal td.exam .lbl{color:var(--exam)}
  table.cal td.ev{background:var(--event-bg)}
  table.cal td.ev .n,table.cal td.ev .lbl{color:var(--event)}
  table.cal td.mk{background:var(--mk)}
  table.cal td.mk .n,table.cal td.mk .lbl,table.cal td.mk .lbl.adm-lbl{color:#fff}
  table.cal td .lbl.adm-lbl{color:var(--adm)}
  table.cal td.out{background:#f6f8fa}
  table.cal td.today{outline:2.5px solid var(--brand);outline-offset:-2.5px;border-radius:4px}
  table.cal td.today .n::after{content:"오늘";font-size:9px;font-weight:900;color:#fff;background:var(--brand);
    border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
  .month .mevents{border-top:1.5px solid var(--line-strong);padding:10px 14px;background:#fbfcfe;flex:1}
  .month .mevents .metitle{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .month .mevents .me{display:flex;gap:10px;align-items:baseline;padding:3.5px 0 3.5px 10px;font-size:13px;
    line-height:1.4;border-left:3.5px solid var(--line-strong)}
  .month .mevents .me+.me{margin-top:2px}
  .month .mevents .me .med{font-weight:800;white-space:nowrap;min-width:76px}
  .month .mevents .me.hol{border-left-color:var(--hol)} .month .mevents .me.hol .med,.month .mevents .me.hol .men{color:var(--hol)}
  .month .mevents .me.term{border-left-color:var(--term)} .month .mevents .me.term .med,.month .mevents .me.term .men{color:var(--term);font-weight:800}
  .month .mevents .me.exam{border-left-color:var(--exam)} .month .mevents .me.exam .med,.month .mevents .me.exam .men{color:var(--exam)}
  .month .mevents .me.event{border-left-color:var(--event)} .month .mevents .me.event .med,.month .mevents .me.event .men{color:var(--event)}
  .month .mevents .me.mk{border-left-color:var(--mk)} .month .mevents .me.mk .med,.month .mevents .me.mk .men{color:var(--mk)}
  .month .mevents .me.adm{border-left-color:var(--adm)} .month .mevents .me.adm .med,.month .mevents .me.adm .men{color:var(--adm)}
  .month .mevents .none{font-size:12px;color:var(--faint);text-align:center;padding:6px 0}

  /* ---------- 수업일수표 ---------- */
  .semtitle{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:19px;font-weight:900;letter-spacing:-.4px}
  .semtitle:first-child{margin-top:0}
  .semtitle .bar{width:6px;height:22px;border-radius:3px;background:var(--brand)}
  .semtitle .range{font-size:13.5px;color:var(--muted);font-weight:600}
  .tablewrap{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;overflow:hidden}
  .tscroll{overflow-x:auto}
  table.weeks{width:100%;min-width:680px;border-collapse:collapse;font-size:14px;table-layout:fixed}
  table.weeks th,table.weeks td{border:1px solid var(--line);padding:6px 5px;text-align:center;vertical-align:middle}
  table.weeks thead th{background:var(--head-bg);color:#1a1a1a;font-weight:800;font-size:13.5px;padding:10px 5px}
  table.weeks th:first-child,table.weeks td.wk{width:7%}
  table.weeks th:last-child,table.weeks td.bigo{width:22%}
  table.weeks td{height:52px}
  table.weeks td.wk{background:var(--brand-soft);font-weight:900;color:var(--brand-dark)}
  table.weeks td .d{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
  table.weeks td.off{background:var(--hol-bg)}
  table.weeks td.off .d{color:var(--hol);font-weight:900}
  table.weeks td.off .oname{display:block;font-size:9.5px;font-weight:800;color:var(--hol);line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.weeks td.pad:not(.off){background:#f4f6f8}
  table.weeks td.pad:not(.off) .d,table.weeks td.pad:not(.off) .oname{color:#9aa3ad}
  table.weeks td.pad:not(.off) .oname{display:block;font-size:9.5px;font-weight:700;line-height:1.1}
  table.weeks td.exam{background:var(--exam-bg)}
  table.weeks td.exam .ename{display:block;font-size:9.5px;font-weight:800;color:var(--exam);line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.weeks td.makeup{background:var(--mk)}
  table.weeks td.makeup .d{color:#fff;font-weight:900}
  table.weeks td.makeup .ename{display:block;font-size:9.5px;font-weight:800;color:#fff;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.weeks td.mark{background:var(--term-bg)}
  table.weeks td.mark .badge{display:block;width:fit-content;margin:3px auto 0;font-size:9.5px;font-weight:900;
    color:#fff;background:var(--term);border-radius:5px;padding:1px 7px;line-height:1.5}
  table.weeks td.end .badge{background:var(--brand)}
  table.weeks td.bigo{text-align:left;font-size:11px;line-height:1.3}
  table.weeks td.bigo .chip{display:inline-block;margin:1px 3px 1px 0;font-size:10.5px;padding:1px 7px;border-radius:6px;
    background:var(--brand-soft);color:#3c5271;font-weight:700}
  table.weeks td.bigo .chip.exam{background:var(--exam-bg);color:var(--exam)}
  table.weeks td.bigo .chip.mk{background:var(--mk);color:#fff}
  table.weeks td.bigo .chip.q{background:var(--term-bg);color:var(--term)}
  .tfoot{padding:12px 18px;border-top:1.5px solid var(--line-strong);background:#fbfcfe;
    font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
  .tfoot b{color:var(--text);font-size:15px}
  .tfoot .q{color:var(--term);font-weight:800}
  .holsum{margin-top:12px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;overflow:hidden}
  .holsum .ttl{background:var(--brand);color:#fff;font-weight:800;padding:9px 15px;font-size:14px}
  table.hs{width:100%;border-collapse:collapse;font-size:13px}
  table.hs th,table.hs td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
  table.hs th{background:var(--head-bg);color:#1a1a1a;font-weight:800}
  table.hs td.lab{background:var(--brand-soft);color:var(--brand-dark);font-weight:900}
  table.hs td .hday{font-weight:900;color:var(--hol)}
  table.hs td .hname{font-size:11px;color:var(--hol);display:block;margin-top:1px}
  .hsnote{padding:9px 14px;font-size:12.5px;color:var(--muted);font-weight:600;border-top:1px solid var(--line)}

  /* ---------- 전체 일정 목록 ---------- */
  .listwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .lmonth{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;overflow:hidden}
  .lmonth .lh{padding:9px 15px;font-weight:900;font-size:15px;background:var(--brand);color:#fff}
  .lmonth .lb{padding:10px 15px}
  .lrow{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .lrow:last-child{border-bottom:0}
  .lrow .dt{font-weight:800;white-space:nowrap;min-width:92px;color:var(--brand-dark)}
  .lrow.hol .dt,.lrow.hol .nm{color:var(--hol);font-weight:700}
  .lrow.term .dt,.lrow.term .nm{color:var(--term);font-weight:800}
  .lrow.exam .dt,.lrow.exam .nm{color:var(--exam);font-weight:700}
  .lrow.event .dt,.lrow.event .nm{color:var(--event);font-weight:700}
  .lrow.mk .dt,.lrow.mk .nm{color:var(--mk);font-weight:700}
  .lrow.adm .dt,.lrow.adm .nm{color:var(--adm);font-weight:700}
  .lmonth .none{font-size:12.5px;color:var(--faint);text-align:center;padding:8px 0}

/* ============================================================

   ============================================================ */
const LS_KEY='academic_calendar_gen_v1';
/* ===== 구글시트 연동 =====
   SHEET_ID가 설정되어 있으면 구글시트를 최우선 데이터 원본으로 사용합니다.

   비우면('') 기존 방식(data.json)으로만 동작합니다. */
const SHEET_ID='1QF-2WMBWpXuozLgWNqZZoFVPDWnX833Fzarfjhamg0c';
/* [파일 → 공유 → 웹에 게시]로 만든 공개 CSV 주소 — 1순위 읽기 경로.
   gviz CSV는 열 타입을 추측해 숫자 셀(학년도·주차 등)을 버리는 문제가 있어,
   셀 값을 그대로 내보내는 이 경로를 우선 사용한다. (반영에 최대 5분 지연 가능) */
const PUB_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRGqVijS9x-5T-yj9B2aydJMMHo14MtDuDCaVrvh_f8c8lYGWOlE2lkDi4yQTfqXWMldu-lrPuncjK9/pub?output=csv';
const DEFAULT_DATA={
  year:2026, sem:1,
  terms:{'2026-1':{start:'2026-03-03',end:'2026-06-22'},'2026-2':{start:'2026-08-31',end:'2026-12-18'}},
  overrides:{}, user:{}, targetWeeks:15, updated:null
};
function decodeShare(){
  const m=location.hash.match(/[#&]d=([^&]+)/);
  if(!m)return null;
  try{return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));}catch(e){return null;}
}
function readLS(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const j=JSON.parse(raw);if(j&&j.terms)return j;}
  }catch(e){}
  return null;
}
function embeddedData(){
  try{
    const el=document.getElementById('published-data');

  }catch(e){}

/* 비교·게시용 핵심 필드만 추출 (관리자 비밀번호 해시 포함 — 게시 시 함께 배포) */
const coreOf=d=>({year:d.year,sem:d.sem,terms:d.terms||{},overrides:d.overrides||{},
                  user:d.user||{},targetWeeks:d.targetWeeks||15,adminPwHash:d.adminPwHash||'',
                  lockYear:d.lockYear!==false,feedback:d.feedback||null,priority:d.priority||null});
/* 구글시트 CSV 로드·해석 : 행 첫 칸(종류)으로 구분 — 학년도/표시학기/주차/의견수렴/학기/일정
   모르는 종류(메모, 제목행 등)는 무시. 날짜는 2027-04-19 · 2027.4.19 · 4/19/2027 형식 허용 */
function parseCSV(txt){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c!=='\r')cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function normDateCell(s){
  s=String(s||'').trim();if(!s)return null;
  let m=s.match(/^(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})\.?$/);
  if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return `${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
  return null;
}
/* 학기키 복원 : 시트가 '2027-1'을 날짜로 자동 변환해 'Fri Jan 01 2027'·'2027-01-01' 등으로
   저장한 경우에도 '2027-1' 형태로 되돌려 읽는다 (1·2월만 학기로 인정) */
function normTermKey(s){
  s=String(s||'').trim();
  if(/^\d{4}-[12]$/.test(s))return s;
  const m=s.match(/^(\d{4})\D+([12])\D*$/);
  if(m)return `${m[1]}-${m[2]}`;
  const d=new Date(s);
  if(!isNaN(d)&&(d.getMonth()===0||d.getMonth()===1))return `${d.getFullYear()}-${d.getMonth()+1}`;
  return s;
}
function sheetToData(rows){
  const KIND={'휴업일':'off','휴업':'off','공휴일':'off','시험':'exam','보강':'makeup','행사':'event','학사':'admin',
              'off':'off','exam':'exam','makeup':'makeup','event':'event','admin':'admin'};
  const d={terms:{},overrides:{},user:{},targetWeeks:15};
  let uid=1;
  rows.forEach(r=>{
    const t=String(r[0]||'').replace(/^﻿/,'').trim();
    if(t==='학년도'){const y=+String(r[1]).trim();if(y>=2000&&y<=2100)d.year=y;}
    else if(t==='표시학기')d.sem=+String(r[1]).trim()===2?2:1;
    else if(t==='주차'){const w=+String(r[1]).trim();if(w>=10&&w<=20)d.targetWeeks=w;}
    else if(t==='의견수렴'){
      const s=normDateCell(r[2]),e=normDateCell(r[3]);
      if(s&&e)d.feedback={start:s<=e?s:e,end:s<=e?e:s};
    }else if(t==='우선표시'){
      // B열 학년도, C·D열 시작·종료일(둘 다 비우면 상시) — 기간 중 그 학년도를 기본 표시
      const y=+String(r[1]||'').trim();
      let s=normDateCell(r[2]),e=normDateCell(r[3]);
      if(s&&e&&s>e){const x=s;s=e;e=x;}
      if(y>=2000&&y<=2100)d.priority={year:y,start:s,end:e};
    }else if(t==='제출주소'){
      const u=String(r[1]||'').trim();
      if(/^https:\/\/script\.google(usercontent)?\.com\//.test(u))d.submitUrl=u;
    }else if(t==='비밀번호해시'){
      const h=String(r[1]||'').trim().toLowerCase();
      if(/^[0-9a-f]{64}$/.test(h))d.adminPwHash=h;   // 관리자 비밀번호(SHA-256) — 모든 기기에 적용
    }else if(t==='연도잠금'){
      const v=String(r[1]||'').trim();
      d.lockYear=!(v==='0'||v==='해제'||v==='전체');  // 0/해제/전체 = 모든 연도 열람 허용
    }else if(t==='학기'){
      const k=normTermKey(r[1]),s=normDateCell(r[2]),e=normDateCell(r[3]);
      if(/^\d{4}-[12]$/.test(k)&&s&&e)d.terms[k]={start:s,end:e};
    }else if(t==='일정'){
      const k=normTermKey(r[1]),s=normDateCell(r[2]);let e=normDateCell(r[3]);
      const name=String(r[4]||'').trim(),kind=KIND[String(r[5]||'').trim()]||'admin';
      if(!/^\d{4}-[12]$/.test(k)||!s||!name)return;
      if(!e||e<s)e=s;
      if(!d.user[k])d.user[k]=[];
      d.user[k].push({id:uid++,iso:s,end:e,name,kind});
    }
  });
  if(!d.year||!Object.keys(d.terms).length)return null;
  return d;
}
/* gviz JSON 결과를 행 배열로 변환 (날짜 셀 Date(y,m,d)는 ISO로) */
function gvizRowsFromJson(json){
  const rows=[];const t=json&&json.table;if(!t)return rows;
  // gviz가 머리글로 흡수한 1행을 복원 (CSV 경로와 행 번호를 맞추기 위해)
  const labels=(t.cols||[]).map(c=>c&&c.label?String(c.label):'');
  if(labels.some(x=>x.trim()))rows.push(labels);
  (t.rows||[]).forEach(r=>{
    rows.push((r.c||[]).map(c=>{
      if(!c)return'';
      let v=(c.f!==undefined&&c.f!==null)?c.f:c.v;
      if(v==null)return'';
      const m=String(v).match(/^Date\((\d+),(\d+),(\d+)/);
      if(m)return `${m[1]}-${pad(+m[2]+1)}-${pad(+m[3])}`;
      return String(v);
    }));
  });
  return rows;
}
/* CORS가 막힌 환경용 예비 경로 : gviz JSONP(script 태그)로 시트 읽기 */
function loadSheetJsonp(sheetName){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject(new Error('timeout'));},8000);
    function cleanup(){clearTimeout(to);try{delete window[cb];}catch(e){}s.remove();}
    window[cb]=res=>{
      cleanup();
      if(!res||res.status==='error')reject(new Error('gviz_error'));
      else resolve(gvizRowsFromJson(res));
    };
    s.onerror=()=>{cleanup();reject(new Error('load_error'));};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}`+
          (sheetName?`&sheet=${encodeURIComponent(sheetName)}`:'')+`&nc=${Date.now()}`;
    document.head.appendChild(s);
  });
}
/* CSV 한 번 받아 행 배열로 (진단용 원문·형식 포함) */
async function fetchCsvRows(url){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    const rows=parseCSV(txt);
    rows._raw=txt;rows._ct=r.headers.get('content-type')||'';
    return rows;
  }finally{clearTimeout(to);}
}
const errMsg=e=>e&&e.name==='AbortError'?'시간초과':String(e&&e.message||e);
/* 시트 행 읽기 : ① 웹에 게시 CSV → ② gviz CSV → ③ gviz JSONP
   — 모두 실패하면 경로별 원인을 담아 throw. 의견 탭은 gviz만 사용(게시 CSV는 첫 탭 전용) */
async function fetchSheetRows(sheetName,fresh){
  const errs=[];
  if(fresh){   // 실시간 우선 — 게시 CSV의 최대 5분 지연을 피해야 할 때([동기화] 버튼 등)
    try{return await loadSheetJsonp(sheetName);}catch(e){errs.push('실시간: '+errMsg(e));}
  }
  if(!sheetName&&PUB_CSV_URL){
    try{return await fetchCsvRows(`${PUB_CSV_URL}&nc=${Date.now()}`);}
    catch(e){errs.push('게시CSV: '+errMsg(e));}
  }
  try{
    return await fetchCsvRows(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`+
                              (sheetName?`&sheet=${encodeURIComponent(sheetName)}`:'')+`&nc=${Date.now()}`);
  }catch(e){errs.push('CSV: '+errMsg(e));}
  try{
    return await loadSheetJsonp(sheetName);   // fetch가 CORS 등으로 막히면 JSONP로 재시도
  }catch(e2){
    errs.push('JSONP: '+errMsg(e2));
    throw new Error(errs.join(' · '));
  }
}
let SHEET_ERR='';   // 시트 읽기 실패 원인 (출처 줄에 표시)
/* 경로를 순서대로 시도하되, "형식 인식까지 성공"해야 채택 —
   삭제된 탭의 게시 CSV처럼 200이지만 빈/엉뚱한 응답이 와도 다음 경로로 넘어간다 */
async function loadSheet(fresh){
  if(!SHEET_ID)return null;
  const errs=[];
  const paths=[];
  const jsonp=['실시간',()=>loadSheetJsonp('')];
  if(fresh&&D&&D.submitUrl)paths.push(['스크립트',async()=>{   // 캐시 지연 없는 원본 읽기 (구버전 스크립트면 다음 경로로)
    const res=await postJSON(D.submitUrl,{action:'read'});
    if(!res||!res.ok||!Array.isArray(res.rows))throw new Error(res&&res.error||'read 실패');
    return res.rows;
  }]);
  if(fresh)paths.push(jsonp);
  if(PUB_CSV_URL)paths.push(['게시CSV',()=>fetchCsvRows(`${PUB_CSV_URL}&nc=${Date.now()}`)]);
  paths.push(['CSV',()=>fetchCsvRows(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&nc=${Date.now()}`)]);
  if(!fresh)paths.push(jsonp);
  for(const[label,get]of paths){
    try{
      const rows=await get();
      const d=sheetToData(rows);
      if(d){SHEET_ERR='';return d;}
      const head=String(rows._raw||'').slice(0,100).replace(/\s+/g,' ')
                 .replace(/[<>&]/g,c=>({'<':'‹','>':'›','&':'＆'}[c]));
      errs.push(`${label}: 형식 인식 실패${rows&&rows.length?(head?` · 응답 시작: ${head}`:` · ${rows.length}행`):' · 빈 응답'}`);
    }catch(e){errs.push(`${label}: ${errMsg(e)}`);}
  }
  SHEET_ERR=errs.join(' · ').replace(/[<>]/g,'');
  return null;
}
async function loadData(fresh){
  const fromHash=decodeShare();
  if(fromHash)return{d:fromHash,src:'공유 링크에 담긴 데이터',hash:true};
  const sheet=await loadSheet(fresh);
  if(sheet){
    // 비밀번호해시 행이 시트에 없으면 게시본·data.json 값으로 보충
    if(!sheet.adminPwHash){try{const emb=embeddedData();if(emb&&emb.adminPwHash)sheet.adminPwHash=emb.adminPwHash;}catch(e){}}
    if(!sheet.adminPwHash){
      try{const r=await fetch('data.json',{cache:'no-store'});
        if(r.ok){const j=await r.json();if(j&&j.adminPwHash)sheet.adminPwHash=j.adminPwHash;}}catch(e){}
    }
    return{d:sheet,src:'구글시트 연동 데이터 (실시간)'};
  }
  // 시트를 읽지 못함 — 어떤 대체 데이터로 표시 중인지, 왜 실패했는지 출처에 명시
  const fail=SHEET_ID?` · ⚠ 구글시트를 읽지 못해 저장본으로 표시 중${SHEET_ERR?` [${SHEET_ERR}]`:''}`:'';
  const ls=readLS(),emb=embeddedData();
  if(ls&&emb&&JSON.stringify(coreOf(ls))===JSON.stringify(coreOf(emb)))
    return{d:emb,src:'게시된 데이터 (최신)'+fail};
  if(ls)return{d:ls,src:'이 브라우저의 생성기 입력값 (실시간 연동)'+fail};
  if(emb)return{d:emb,src:'게시된 데이터'+fail};
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();if(j&&j.terms)return{d:j,src:'게시된 데이터(data.json)'+fail};}
  }catch(e){}
  return{d:DEFAULT_DATA,src:'기본값 (입력된 데이터 없음)'+fail};
}

/* ============================================================
   1. 한국 공휴일 엔진 + 날짜 유틸 (생성기와 동일 로직)
   ============================================================ */
const LUNAR={
  2025:{seollal:'2025-01-29',buddha:'2025-05-05',chuseok:'2025-10-06'},
  2026:{seollal:'2026-02-17',buddha:'2026-05-24',chuseok:'2026-09-25'},
  2027:{seollal:'2027-02-07',buddha:'2027-05-13',chuseok:'2027-09-15'},
  2028:{seollal:'2028-01-27',buddha:'2028-05-02',chuseok:'2028-10-03'},
  2029:{seollal:'2029-02-13',buddha:'2029-05-20',chuseok:'2029-09-22'},
  2030:{seollal:'2030-02-03',buddha:'2030-05-09',chuseok:'2030-09-12'},
};
const EXTRA={
  2025:[['2025-01-27','임시공휴일'],['2025-06-03','대통령선거']],
  2026:[['2026-06-03','지방선거']],
};
const FIXED=[
  [1,1,'신정',false],[3,1,'삼일절',true],[5,5,'어린이날',true],
  [6,6,'현충일',false],[8,15,'광복절',true],[10,3,'개천절',true],
  [10,9,'한글날',true],[12,25,'성탄절',true],
];
const YEARS=[2025,2026,2027,2028,2029,2030];
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const shortMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
const WKShort=['일','월','화','수','목','금','토'];

function buildHolidays(year){
  const base={};
  const addB=(iso,name,elig,block=null)=>{(base[iso]=base[iso]||[]).push({name,elig,block});};
  FIXED.forEach(([m,d,name,elig])=>addB(`${year}-${pad(m)}-${pad(d)}`,name,elig));
  const L=LUNAR[year];
  if(L){
    const s=fromISO(L.seollal);
    [[-1,'설날연휴'],[0,'설날'],[1,'설날연휴']].forEach(([o,n])=>addB(toISO(addDays(s,o)),n,true,'seollal'));
    const c=fromISO(L.chuseok);
    [[-1,'추석연휴'],[0,'추석'],[1,'추석연휴']].forEach(([o,n])=>addB(toISO(addDays(c,o)),n,true,'chuseok'));
    addB(L.buddha,'부처님오신날',true);
  }
  (EXTRA[year]||[]).forEach(([iso,name])=>addB(iso,name,false));
  const holiset=new Set(Object.keys(base));
  const subs={};
  const nextFree=iso=>{
    let d=addDays(fromISO(iso),1);
    while(d.getDay()===0||d.getDay()===6||holiset.has(toISO(d))||subs[toISO(d)])d=addDays(d,1);
    return toISO(d);
  };
  ['seollal','chuseok'].forEach(block=>{
    const days=Object.keys(base).filter(iso=>base[iso].some(x=>x.block===block)).sort();
    if(!days.length)return;
    const hasSun=days.some(iso=>fromISO(iso).getDay()===0);
    const overlap=days.some(iso=>base[iso].length>1);
    if(hasSun||overlap){const sd=nextFree(days[days.length-1]);subs[sd]='대체공휴일';}
  });
  Object.keys(base).sort().forEach(iso=>{
    const lst=base[iso];
    if(lst.some(x=>x.block))return;
    if(!lst.some(x=>x.elig))return;
    const wd=fromISO(iso).getDay();
    if(wd===0||wd===6||lst.length>1){const sd=nextFree(iso);subs[sd]='대체공휴일';}
  });
  const out=[];
  Object.keys(base).forEach(iso=>out.push({iso,name:base[iso].map(x=>x.name).join('·'),kind:'law'}));
  Object.keys(subs).forEach(iso=>out.push({iso,name:subs[iso],kind:'sub'}));
  out.sort((a,b)=>a.iso<b.iso?-1:1);
  return out;
}

function defaultTerm(year,sem){
  if(year===2026&&sem===1)return{start:'2026-03-03',end:'2026-06-22'};
  if(year===2026&&sem===2)return{start:'2026-08-31',end:'2026-12-18'};
  const firstMon=(y,m,d)=>{let x=new Date(y,m-1,d);while(x.getDay()!==1)x=addDays(x,1);return x;};
  if(sem===1){const s=firstMon(year,3,2);return{start:toISO(s),end:toISO(addDays(s,16*7-4))};}
  const s=firstMon(year,9,1);return{start:toISO(s),end:toISO(addDays(s,16*7-4))};
}

/* ============================================================
   2. 계산 (생성기 computeFor / semRange / calData 이식 — 읽기 전용)
   ============================================================ */
let D=DEFAULT_DATA;           // 공유 데이터
const V={year:2026,view:'cal'};  // 화면 상태

const termOf=(year,sem)=>(D.terms&&D.terms[`${year}-${sem}`])||defaultTerm(year,sem);
const usersOf=(year,sem)=>(D.user&&D.user[`${year}-${sem}`])||[];

function computeFor(year,sem){
  const t=termOf(year,sem);
  const start=fromISO(t.start),end=fromISO(t.end);
  const valid=start<=end;
  const holidays=[...buildHolidays(year),...buildHolidays(year+1)];
  const inRangeHol=holidays.filter(h=>h.iso>=t.start&&h.iso<=t.end);
  const effMap={};
  const push=(iso,name,off,kind)=>{
    if(!effMap[iso])effMap[iso]={names:[],off:false,kinds:new Set(),items:[]};
    effMap[iso].names.push(name);effMap[iso].kinds.add(kind);effMap[iso].items.push({name,kind});
    if(off)effMap[iso].off=true;
  };
  const OV=D.overrides||{};
  inRangeHol.forEach(h=>{
    const ov=OV[h.iso]||{};
    if(ov.hidden)return;
    const off=ov.off!==undefined?ov.off:true;
    push(h.iso,h.name,off,'hol');
  });
  usersOf(year,sem).forEach(u=>{
    for(let d=fromISO(u.iso);d<=fromISO(u.end||u.iso);d=addDays(d,1)){
      const iso=toISO(d);
      if(iso<t.start||iso>t.end)continue;
      push(iso,u.name,u.kind==='off',u.kind);
    }
  });
  const cols=[[],[],[],[],[]];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const wd=d.getDay();
    if(wd>=1&&wd<=5)cols[wd-1].push(new Date(d));
  }
  const rows=Math.max(...cols.map(c=>c.length),0);
  const classDays=[];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const wd=d.getDay();
    if(wd>=1&&wd<=5&&!(effMap[toISO(d)]&&effMap[toISO(d)].off))classDays.push(new Date(d));
  }
  const total=classDays.length;
  const quarters={};
  [1,2,3].forEach(k=>{
    if(total>0){const idx=Math.ceil(total*k/4)-1;if(idx>=0&&idx<total)quarters[toISO(classDays[idx])]=`${k}/4`;}
  });
  const endISO=total>0?toISO(classDays[total-1]):null;
  const openISO=total>0?toISO(classDays[0]):null;   // 개강 표시 = 첫 실제 수업일 (시작일이 휴일이면 다음 수업일)
  /* 표 표시용 열 : 개강 주·종강 주의 학기 밖 평일도 채워 달력 주와 줄을 맞춤 (수업일수 계산엔 미포함) */
  const padHol=iso=>{const ov=OV[iso]||{};if(ov.hidden)return null;
    const h=holidays.filter(x=>x.iso===iso).map(x=>x.name);return h.length?h:null;};
  const grid=cols.map(arr=>arr.map(d=>({d})));
  if(valid){
    const sw=start.getDay(),ew=end.getDay();
    if(sw>=2&&sw<=5)for(let wd=1;wd<sw;wd++){const d=addDays(start,wd-sw);grid[wd-1].unshift({d,pad:'pre',hol:padHol(toISO(d))});}
    if(ew>=1&&ew<=4)for(let wd=ew+1;wd<=5;wd++){const d=addDays(end,wd-ew);grid[wd-1].push({d,pad:'post',hol:padHol(toISO(d))});}
  }
  const gridRows=Math.max(...grid.map(c=>c.length),0);
  return{t,start,end,valid,cols,rows,grid,gridRows,effMap,classDays,total,quarters,endISO,openISO,inRangeHol};
}

function semRange(year,sem){
  const t=termOf(year,sem);
  const OV=D.overrides||{};
  const offSet=new Set();
  [...buildHolidays(year),...buildHolidays(year+1)].forEach(h=>{
    if(h.iso<t.start||h.iso>t.end)return;
    const ov=OV[h.iso]||{};
    if(ov.hidden)return;
    if(ov.off!==undefined?ov.off:true)offSet.add(h.iso);
  });
  usersOf(year,sem).forEach(u=>{
    if(u.kind!=='off')return;
    for(let d=fromISO(u.iso);d<=fromISO(u.end||u.iso);d=addDays(d,1))offSet.add(toISO(d));
  });
  const classDays=[];
  for(let d=fromISO(t.start);d<=fromISO(t.end);d=addDays(d,1)){
    const wd=d.getDay();
    if(wd>=1&&wd<=5&&!offSet.has(toISO(d)))classDays.push(toISO(d));
  }
  const total=classDays.length;
  const quarters={};
  [1,2,3].forEach(k=>{
    if(total>0){const idx=Math.ceil(total*k/4)-1;if(idx>=0&&idx<total)quarters[classDays[idx]]=`${k}/4`;}
  });
  return{start:total?classDays[0]:t.start,end:total?classDays[total-1]:null,quarters,total};
}

function calData(year){
  const y=year;
  const monthsList=[[y,2],[y,3],[y,4],[y,5],[y,6],[y,7],[y,8],[y,9],[y,10],[y,11],[y+1,0],[y+1,1]];
  const yearUsers=[...usersOf(y,1),...usersOf(y,2)];
  const evMap={};
  [...buildHolidays(y),...buildHolidays(y+1)].forEach(h=>{
    const e=evMap[h.iso]=evMap[h.iso]||{names:[],kinds:new Set()};
    e.kinds.add('hol');e.names.push(h.name);
  });
  yearUsers.forEach(u=>{
    if(u.kind==='admin'){
      const e=evMap[u.iso]=evMap[u.iso]||{names:[],kinds:new Set()};
      e.kinds.add('admin');
      let nm=u.name;
      if(u.end&&u.end!==u.iso){
        const sd=fromISO(u.iso),ed=fromISO(u.end);
        const sameM=sd.getFullYear()===ed.getFullYear()&&sd.getMonth()===ed.getMonth();
        nm+=`(~${sameM?ed.getDate():(ed.getMonth()+1)+'/'+ed.getDate()})`;
      }
      e.adm=e.adm||[];
      if(!e.adm.includes(nm))e.adm.push(nm);
      return;
    }
    for(let d=fromISO(u.iso);d<=fromISO(u.end||u.iso);d=addDays(d,1)){
      const iso=toISO(d),e=evMap[iso]=evMap[iso]||{names:[],kinds:new Set()};
      e.kinds.add(u.kind);
      const showName=iso===u.iso||d.getDay()===0||d.getDate()===1;
      if(showName&&!e.names.includes(u.name))e.names.push(u.name);
    }
  });
  const termItems=[];const termLbl={};
  [1,2].forEach(sem=>{
    const r=semRange(y,sem);
    [[r.start,`${sem}학기 개강`,'개강'],[r.end,`${sem}학기 종강`,'종강']].forEach(([iso,name,short])=>{
      if(!iso)return;
      termItems.push({s:iso,e:iso,name,type:'term'});
      termLbl[iso]=termLbl[iso]?termLbl[iso]+'·'+short:short;
    });
    Object.keys(r.quarters).forEach(iso=>{
      const q=r.quarters[iso],k=+q[0];
      termItems.push({s:iso,e:iso,name:`${sem}학기 수업 ${q} (${Math.ceil(r.total*k/4)}일)`,type:'term'});
      termLbl[iso]=termLbl[iso]?termLbl[iso]+'·수업 '+q:'수업 '+q;
    });
  });
  const spanStart=new Date(monthsList[0][0],monthsList[0][1],1);
  const lm=monthsList[monthsList.length-1];
  const spanEnd=new Date(lm[0],lm[1]+1,0);
  const items=[];
  [...buildHolidays(y),...buildHolidays(y+1)].forEach(h=>{const d=fromISO(h.iso);if(d>=spanStart&&d<=spanEnd)items.push({s:h.iso,e:h.iso,name:h.name,type:'hol'});});
  yearUsers.forEach(u=>{const d=fromISO(u.iso);if(d>=spanStart&&d<=spanEnd)items.push({s:u.iso,e:u.end||u.iso,name:u.name,type:u.kind});});
  termItems.forEach(it=>{const d=fromISO(it.s);if(d>=spanStart&&d<=spanEnd)items.push(it);});
  items.sort((a,b)=>a.s<b.s?-1:(a.s>b.s?1:0));
  return{y,monthsList,evMap,termLbl,items};
}
const cls3=tp=>({hol:'hol',off:'hol',exam:'exam',event:'event',term:'term',makeup:'mk',admin:'adm'}[tp]||'');
const dlabel=(s,e)=>{const ds=fromISO(s);return(e&&e!==s)?`${shortMD(ds)}~${shortMD(fromISO(e))}`:`${shortMD(ds)}(${WKShort[ds.getDay()]})`;};

/* ============================================================
   인쇄 : 새 창에 가로 인쇄용 문서 (A4/A3 가로, 학기별 2장 / 연간 한 장)
   ============================================================ */
/* 인쇄 창용 학교 CI : 새 창(about:blank)은 이미지 로딩이 늦거나 막힐 수 있어 미리 읽어 data URL로 넣는다 */
let CI_FULL=new URL('assets/ci-full.png',location.href).href;
try{fetch(CI_FULL).then(r=>r.ok?r.blob():null).then(b=>{if(!b)return;const fr=new FileReader();fr.onload=()=>{CI_FULL=fr.result;};fr.readAsDataURL(b);}).catch(()=>{});}catch(e){}
function printDoc(paper,mode){
  const {y,monthsList,evMap,termLbl,items}=calData(V.year);
  const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const md=iso=>{const d=fromISO(iso);return `${d.getMonth()+1}.${d.getDate()}`;};
  const mdw=iso=>{const d=fromISO(iso);return `${d.getMonth()+1}.${d.getDate()}(${WKShort[d.getDay()]})`;};
  const sems=[1,2].map(sem=>{
    const r=semRange(y,sem),d=computeFor(y,sem);
    const exams=usersOf(y,sem).filter(u=>u.kind==='exam').sort((a,b)=>a.iso<b.iso?-1:1)
      .map(u=>`${E(u.name)} ${md(u.iso)}~${md(u.end||u.iso)}`).join(' · ');
    const q={};Object.keys(r.quarters).forEach(iso=>q[r.quarters[iso]]=md(iso));
    return {sem,start:r.start,end:r.end,total:r.total,weeks:d.rows,exams,
      quarters:`1/4 ${q['1/4']||'–'} · 2/4 ${q['2/4']||'–'} · 3/4 ${q['3/4']||'–'}`};
  });
  const semBox=s=>`<div class="sem">
      <span class="chip">${s.sem}학기</span>
      <b class="rng">${s.start?mdw(s.start):'–'} ~ ${s.end?mdw(s.end):'–'}</b>
      <span class="days"><b>${s.total}</b>일 · ${s.weeks}주</span>
      <span class="sub">분기점 ${s.quarters}${s.exams?` <i>|</i> ${s.exams}`:''}</span></div>`;
  const legend=`<div class="legend">
      <span><i class="lg hol"></i>공휴일·휴업일</span><span><i class="lg term"></i>개강·종강·분기</span>
      <span><i class="lg exam"></i>시험</span><span><i class="lg mk"></i>지정 보강</span>
      <span><i class="lg ev"></i>행사</span><span><i class="lg adm"></i>학사</span></div>`;
  const monthBox=([yy,mm],big)=>{
    const first=new Date(yy,mm,1),dim=new Date(yy,mm+1,0).getDate();
    let cells='',dow=first.getDay();
    for(let i=0;i<dow;i++)cells+='<td class="out"></td>';
    for(let dd=1;dd<=dim;dd++){
      const d=new Date(yy,mm,dd),iso=toISO(d),wd=d.getDay(),ev=evMap[iso],tm=termLbl[iso];
      const c=[];if(wd===0)c.push('sun');if(wd===6)c.push('sat');
      if(ev&&(ev.kinds.has('hol')||ev.kinds.has('off')))c.push('hol');
      else if(ev&&ev.kinds.has('makeup'))c.push('mk');
      else if(ev&&ev.kinds.has('exam'))c.push('exam');
      else if(tm)c.push('term');
      else if(ev&&ev.kinds.has('event'))c.push('ev');
      let lbl='';

      }

      if(wd===6&&dd<dim)cells+='</tr><tr>';
    }

    const mS=new Date(yy,mm,1),mE=new Date(yy,mm+1,0);
    const list=items.filter(it=>{const s=fromISO(it.s);return s>=mS&&s<=mE;})
      .map(it=>`<div class="li ${cls3(it.type)}"><b>${dlabel(it.s,it.e)}</b> ${E(it.name)}</div>`).join('')
      ||'<div class="none">일정 없음</div>';
    return `<section class="month">
      <h3>${mm+1}월<small>${yy}</small></h3>
      <table class="cal"><thead><tr>${['일','월','화','수','목','금','토'].map((w,i)=>`<th class="${i===0?'sun':i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
      <tbody><tr>${cells}</tr></tbody></table>
      <div class="list">${list}</div></section>`;
  };
  const yearPage=`<div class="page year">
      <header><img class="ci" src="${CI_FULL}" alt="신성대학교"><div class="ttl"><h1>${y}학년도 학사일정</h1><span>${y}. 3. ~ ${y+1}. 2.</span></div>
        <div class="sems">${sems.map(semBox).join('')}</div>${legend}</header>
      <div class="grid g6">${monthsList.map(m=>monthBox(m,false)).join('')}</div></div>`;
  const semPage=(s,months)=>`<div class="page semp">
      <header><img class="ci" src="${CI_FULL}" alt="신성대학교"><div class="ttl"><h1>${y}학년도 ${s.sem}학기 학사일정</h1></div>
        <div class="sems">${semBox(s)}</div>${legend}</header>
      <div class="grid g3">${months.map(m=>monthBox(m,true)).join('')}</div></div>`;
  const semPages=semPage(sems[0],monthsList.slice(0,6))+semPage(sems[1],monthsList.slice(6));
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${y}학년도 학사일정</title>

/* [인쇄] : 누를 때마다 시트에서 최신 일정을 다시 읽은 뒤 인쇄물을 만든다
   (창은 클릭 즉시 열어야 팝업 차단을 피하므로 '불러오는 중'을 먼저 띄우고 내용을 채움) */
async function freshForPrint(){
  if(decodeShare()||!SHEET_ID)return;                    // 공유 링크 보기는 링크에 담긴 데이터 그대로
  try{await Promise.race([refreshData(),new Promise(r=>setTimeout(r,8000))]);}catch(e){}
}
function openPrint(){
  const isTable=V.view==='table';

  if(!w){                                                 // 팝업이 막힌 환경 : 최신 데이터로 현재 화면 인쇄
    freshForPrint().then(()=>{
      let st=document.getElementById('pgPortrait');
      if(!st){st=document.createElement('style');st.id='pgPortrait';document.head.appendChild(st);}
      st.textContent=isTable?'@media print{@page{size:A4 portrait;margin:8mm}}':'';
      window.print();setTimeout(()=>{st.textContent='';},1000);
    });
    return;
  }
  w.document.open();
  w.document.write('<!doctype html><meta charset="utf-8"><title>인쇄 준비</title><body style="font-family:Malgun Gothic,sans-serif;display:flex;align-items:center;justify-content:center;height:90vh;color:#334;font-size:16px">구글시트에서 최신 학사일정을 불러오는 중…</body>');
  w.document.close();
  freshForPrint().then(()=>{
    if(w.closed)return;
    let html;
    if(isTable)html=tableDoc();
    else{
      let pref={p:'A4',m:'sem'};
      try{const s=JSON.parse(localStorage.getItem('ac_print_pref')||'null');if(s&&s.p)pref=s;}catch(e){}
      html=printDoc(pref.p==='A3'?'A3':'A4',pref.m==='year'?'year':'sem');
    }
    w.document.open();w.document.write(html);w.document.close();
  });
}

/* ============================================================
   3. 렌더링
   ============================================================ */
const $=s=>document.querySelector(s);
const todayISO=toISO(new Date());

/* 학년도 기준(3월 시작)으로 해당 날짜가 속한 학년도 */
const academicYearOf=iso=>{const[y,m]=iso.split('-').map(Number);return m>=3?y:y-1;};
/* 시트 [우선표시] 행이 오늘 유효하면 반환 — 기간(비우면 상시) 중 그 학년도를 우선 안내 */
function priorityInfo(){
  const p=D.priority;
  if(!p||!p.year||!YEARS.includes(p.year))return null;
  if(p.start&&todayISO<p.start)return null;
  if(p.end&&todayISO>p.end)return null;
  return p;
}
/* 처음 보여줄 학년도 : 우선표시 → (연도잠금 시) 게시 학년도 → 오늘이 속한 학년도 → 게시 학년도 */
function initialYear(){
  const p=priorityInfo();
  if(p)return p.year;
  if(D.lockYear!==false)return D.year&&YEARS.includes(D.year)?D.year:V.year;
  const cur=academicYearOf(todayISO);
  if(YEARS.includes(cur)&&hasInput(cur))return cur;
  return D.year&&YEARS.includes(D.year)?D.year:V.year;
}

function hasInput(year){
  return !!((D.terms&&(D.terms[`${year}-1`]||D.terms[`${year}-2`]))||
            (D.user&&((D.user[`${year}-1`]||[]).length||(D.user[`${year}-2`]||[]).length)));
}

function renderYearNav(){
  /* 관리자가 학년도를 고정(lockYear)하면 그 학년도만 표시하고 연도 이동을 숨김 */
  const locked=D.lockYear!==false;
  if(locked){
    const p=priorityInfo();               // 잠금 중에도 [우선표시] 기간에는 그 학년도를 보여준다
    const fy=(p&&p.year)||D.year;
    if(fy&&YEARS.includes(fy))V.year=fy;
  }
  $('#yPrev').hidden=locked;
  $('#yNext').hidden=locked;
  $('#ySel').hidden=locked;
  const sel=$('#ySel');
  if(!sel.options.length){
    YEARS.forEach(y=>{const o=document.createElement('option');o.value=y;sel.appendChild(o);});
  }
  [...sel.options].forEach(o=>{o.textContent=`${o.value}학년도${hasInput(+o.value)?' ●':''}`;});
  sel.value=V.year;
  $('#yTitle').textContent=`${V.year}학년도 학사일정`;
  document.title=`${V.year}학년도 학사일정 안내`;
  $('#yPrev').disabled=V.year<=YEARS[0];
  $('#yNext').disabled=V.year>=YEARS[YEARS.length-1];
}

function renderUpcoming(items){
  const el=$('#upcoming');
  const spanStart=`${V.year}-03-01`,spanEnd=`${V.year+1}-02-28`;
  if(todayISO<spanStart||todayISO>`${V.year+1}-03-01`){el.hidden=true;return;}
  const up=items.filter(it=>(it.e||it.s)>=todayISO).slice(0,5);
  if(!up.length){el.hidden=true;return;}
  const dday=iso=>{
    const n=Math.round((fromISO(iso)-fromISO(todayISO))/86400000);
    return n<=0?'진행중':(n===0?'D-DAY':`D-${n}`);
  };
  el.innerHTML=`<div class="ut"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>다가오는 일정</div>
    <div class="chips">${up.map(it=>`<span class="uchip ${cls3(it.type)}"><span class="dd">${it.s<=todayISO?'진행중':dday(it.s)}</span>${dlabel(it.s,it.e)} ${it.name}</span>`).join('')}</div>`;
  el.hidden=false;
}

function renderCalendar(){
  const{y,monthsList,evMap,termLbl,items}=calData(V.year);

  const wk=['일','월','화','수','목','금','토'];

    <span><i style="background:var(--hol-bg);border-color:var(--hol)"></i>공휴일·휴업일</span>
    <span><i style="background:var(--term-bg);border-color:var(--term)"></i>개강·종강·분기</span>
    <span><i style="background:var(--exam-bg);border-color:var(--exam)"></i>시험</span>
    <span><i style="background:var(--mk);border-color:var(--mk)"></i>보강</span>

    <span title="수강신청·등록 등 학사 일정은 칸 색 없이 글자로만 표시됩니다"><span class="lgnote">학사 일정(수강신청·등록 등)은 칸 색 없이 <b>글자로만</b> 표시</span></span></div>`;
  html+=`<div class="monthnav no-print" id="monthnav">`+

    `</div>`;
  html+='<div class="months">';
  monthsList.forEach(([yy,mm])=>{
    const first=new Date(yy,mm,1),dim=new Date(yy,mm+1,0).getDate();
    let cells='';let dow=first.getDay();
    for(let i=0;i<dow;i++)cells+='<td class="out"></td>';
    for(let dd=1;dd<=dim;dd++){
      const d=new Date(yy,mm,dd),iso=toISO(d),wd=d.getDay();
      const ev=evMap[iso];const tm=termLbl[iso];
      let c=[];
      if(wd===0)c.push('sun');if(wd===6)c.push('sat');
      let ek=null;
      if(ev){if(ev.kinds.has('hol')||ev.kinds.has('off'))ek='ho';else if(ev.kinds.has('exam'))ek='exam';else if(ev.kinds.has('makeup'))ek='mk';else if(ev.kinds.has('event'))ek='ev';else if(ev.kinds.has('admin'))ek='adm';}
      if(tm)c.push('term');else if(ek)c.push(ek);
      if(iso===todayISO)c.push('today');
      let labels=[];
      if(tm)labels.push(tm);
      if(ev)labels.push(...ev.names);
      let lbl=labels.map(l=>`<span class="lbl">${l}</span>`).join('');
      if(ev&&ev.adm)lbl+=ev.adm.map(l=>`<span class="lbl adm-lbl">${l}</span>`).join('');
      cells+=`<td class="${c.join(' ')}" data-iso="${iso}"><span class="n">${dd}</span>${lbl}</td>`;
      if(wd===6&&dd<dim)cells+='</tr><tr>';
    }
    for(let i=new Date(yy,mm,dim).getDay()+1;i<7;i++)cells+='<td class="out"></td>';
    const mStart=new Date(yy,mm,1),mEnd=new Date(yy,mm+1,0);
    const mItems=items.filter(it=>{const s=fromISO(it.s),e2=fromISO(it.e||it.s);return s<=mEnd&&e2>=mStart;});
    const meHtml=mItems.length
      ?mItems.map(it=>`<div class="me ${cls3(it.type)}"><span class="med">${dlabel(it.s,it.e)}</span><span class="men">${it.name}</span></div>`).join('')
      :'<div class="none">— 일정 없음 —</div>';
    html+=`<div class="month" id="m-${yy}-${mm+1}"><div class="mh"><svg class="icon" style="font-size:15px" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>${yy}년 ${mm+1}월</div>`+
      `<table class="cal"><thead><tr>${wk.map((w,i)=>`<th class="${i===0?'sun':i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>`+
      `<tbody><tr>${cells}</tr></tbody></table>`+
      `<div class="mevents"><div class="metitle">이달의 주요 일정</div>${meHtml}</div></div>`;
  });
  html+='</div>';
  $('#viewCal').innerHTML=html;
  wireMonthNav();

/* 월 바로가기 : 버튼 클릭 시 해당 월로 스크롤 + 스크롤 위치에 따라 현재 월 표시 */
let calMonthEls=[];
function wireMonthNav(){
  const nav=$('#monthnav');if(!nav)return;
  calMonthEls=[...document.querySelectorAll('.month[id^="m-"]')];
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const el=document.getElementById(b.dataset.t);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });
  measureSticky();lastOn='';
  updateMonthNav();
}
/* 고정 위치 계산 : 상단 바가 고정(넓은 화면)일 때만 그 높이만큼 아래에 붙이고, 모바일처럼 고정이 풀리면 화면 맨 위에 붙임 */
function measureSticky(){
  const tb=document.querySelector('.topbar'),nav=$('#monthnav'),rs=document.documentElement.style;
  const tbh=tb&&getComputedStyle(tb).position==='sticky'?tb.offsetHeight:0;
  rs.setProperty('--tbh',tbh+'px');
  if(nav&&nav.offsetHeight)rs.setProperty('--mnh',nav.offsetHeight+'px');
  return tbh+(nav?nav.offsetHeight:0);
}
let lastOn='';
function updateMonthNav(){
  const nav=$('#monthnav');
  if(!nav||!calMonthEls.length||V.view!=='cal')return;
  const line=nav.getBoundingClientRect().bottom+12;   // 월 바로가기 바로 아래를 지나간 달 = 현재 달
  let cur=calMonthEls[0].id;
  calMonthEls.forEach(el=>{if(el.getBoundingClientRect().top<=line)cur=el.id;});
  const de=document.documentElement;   // 맨 아래까지 내렸으면 마지막 달(더 올라갈 수 없어 기준선에 닿지 못함)
  if(window.innerHeight+window.scrollY>=de.scrollHeight-2){
    const last=calMonthEls[calMonthEls.length-1];if(last.getBoundingClientRect().top<window.innerHeight)cur=last.id;}
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
  if(cur!==lastOn){lastOn=cur;   // 한 줄 스크롤(모바일)에서 현재 달 버튼이 보이도록
    const b=nav.querySelector('button.on');
    if(b&&nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2,behavior:'smooth'});}
}
window.addEventListener('scroll',()=>{requestAnimationFrame(updateMonthNav);},{passive:true});
window.addEventListener('resize',()=>{measureSticky();updateMonthNav();});

function buildTableHTML(data,sem){
  const t=data.t;
  const hdW=['월','화','수','목','금'];
  let body='';
  for(let r=0;r<data.gridRows;r++){
    let tds=`<td class="wk">${r+1}</td>`;
    let notes=[];
    for(let c=0;c<5;c++){
      const g=data.grid[c][r],d=g&&g.d;
      if(!d){tds+='<td class="day"></td>';continue;}
      if(g.pad){   // 학기 밖 날짜 : 휴일이면 휴일 칸, 아니면 흐린 칸
        tds+=g.hol?`<td class="day off pad"><span class="d">${shortMD(d)}</span><span class="oname">${g.hol[0]}</span></td>`
                  :`<td class="day pad"><span class="d">${shortMD(d)}</span><span class="oname">${g.pad==='pre'?'개강 전':'종강 후'}</span></td>`;
        continue;
      }
      const iso=toISO(d);const eff=data.effMap[iso];
      const isOff=eff&&eff.off;
      const isExam=eff&&!isOff&&eff.kinds.has('exam');
      const isMakeup=eff&&!isOff&&eff.kinds.has('makeup');
      const isStart=iso===(data.openISO||t.start);const isEnd=iso===data.endISO;
      let cls='day';
      if(isOff)cls+=' off';
      else if(isExam)cls+=' exam';
      else if(isMakeup)cls+=' makeup';
      if(isStart)cls+=' mark';
      if(isEnd)cls+=' mark end';
      let inner=`<span class="d">${shortMD(d)}</span>`;
      if(isOff)inner+=`<span class="oname">${eff.names[0]||''}</span>`;
      if(isExam||isMakeup){
        const enames=[...new Set(eff.items.filter(x=>x.kind==='exam'||x.kind==='makeup').map(x=>x.name))].join('·');
        inner+=`<span class="ename">${enames}</span>`;
      }
      if(isStart)inner+='<div class="badge">개강</div>';
      if(isEnd)inner+='<div class="badge">종강</div>';
      tds+=`<td class="${cls}">${inner}</td>`;
      if(isExam||isMakeup)eff.items.forEach(it=>{
        if(it.kind==='exam')notes.push({t:it.name,c:'exam'});
        else if(it.kind==='makeup')notes.push({t:it.name,c:'mk'});
      });
      if(isStart)notes.push({t:`${sem}학기 개강`,c:'q'});
      if(isEnd)notes.push({t:`${sem}학기 종강`,c:'q'});
    }
    const seen=new Set();
    const chips=notes.filter(n=>{if(seen.has(n.t))return false;seen.add(n.t);return true;})
      .map(n=>`<span class="chip ${n.c}">${n.t}</span>`).join('');
    body+=`<tr>${tds}<td class="bigo">${chips}</td></tr>`;
  }
  const head=`<tr><th>주차</th>${hdW.map(w=>`<th>${w}</th>`).join('')}<th>비고</th></tr>`;
  const offByCol=[[],[],[],[],[]];
  Object.keys(data.effMap).forEach(iso=>{
    if(!data.effMap[iso].off)return;
    const d=fromISO(iso);const wd=d.getDay();
    if(wd>=1&&wd<=5)offByCol[wd-1].push({d,names:data.effMap[iso].names});
  });
  data.grid.forEach((col,c)=>col.forEach(g=>{if(g.pad&&g.hol)offByCol[c].push({d:g.d,names:g.hol});}));
  offByCol.forEach(c=>c.sort((a,b)=>a.d-b.d));
  const maxOff=Math.max(...offByCol.map(c=>c.length),0);
  let hsRows='';
  for(let r=0;r<maxOff;r++){
    let cells='';
    for(let c=0;c<5;c++){
      const o=offByCol[c][r];
      cells+=o?`<td><span class="hday">${shortMD(o.d)}(${WKShort[o.d.getDay()]})</span><span class="hname">${o.names.join(', ')}</span></td>`:'<td></td>';
    }
    if(r===0)hsRows+=`<tr><td class="lab" rowspan="${maxOff}">휴일</td>${cells}</tr>`;
    else hsRows+=`<tr>${cells}</tr>`;
  }
  const holsum=maxOff?`
    <div class="holsum">
      <div class="ttl">${sem}학기 중 휴일 안내</div>
      <div class="tscroll"><table class="hs">
        <thead><tr><th>구분</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
        <tbody>${hsRows}</tbody>
      </table></div>
      <div class="hsnote">* 수업일수(${data.total}일): 1/4(${Math.ceil(data.total/4)}일), 2/4(${Math.ceil(data.total*2/4)}일), 3/4(${Math.ceil(data.total*3/4)}일)</div>
    </div>`:'';
  const q={};Object.keys(data.quarters).forEach(iso=>q[data.quarters[iso]]=shortMD(fromISO(iso)));
  const footer=`<div class="tfoot">
    <span>총 <b>${data.total}일</b></span>
    <span class="q">1/4 ${q['1/4']||'–'} (${Math.ceil(data.total/4)}일)</span>
    <span class="q">2/4 ${q['2/4']||'–'} (${Math.ceil(data.total*2/4)}일)</span>
    <span class="q">3/4 ${q['3/4']||'–'} (${Math.ceil(data.total*3/4)}일)</span>
    <span class="q">종강 ${data.endISO?shortMD(fromISO(data.endISO)):'–'} (${data.total}일)</span>
  </div>`;
  return `
    <div class="semtitle"><span class="bar"></span>${V.year}학년도 ${sem}학기 수업일수
      <span class="range">${t.start.replace(/-/g,'.')} ~ ${t.end.replace(/-/g,'.')}</span></div>
    <div class="tablewrap"><div class="tscroll">
      <table class="weeks"><thead>${head}</thead><tbody>${body}</tbody></table>
    </div>${footer}</div>
    ${holsum}`;
}

function renderTable(){
  let html='';

    const d=computeFor(V.year,sem);

function renderPrioBar(){
  const bar=$('#priobar');if(!bar)return;
  const p=priorityInfo();

  const period=p.start&&p.end?` (${p.start} ~ ${p.end})`:'';
  const cur=academicYearOf(todayISO);
  let btn='';
  if(D.lockYear===false){                 // 잠금 해제 시에만 연도 전환 버튼 제공
    if(V.year!==p.year)btn=`<button id="prioGo" data-y="${p.year}">${p.year}학년도 보기</button>`;
    else if(YEARS.includes(cur)&&cur!==p.year&&hasInput(cur))btn=`<button id="prioGo" data-y="${cur}">현재(${cur}학년도) 일정 보기</button>`;
  }
  bar.innerHTML=`<span>📌 <b>${p.year}학년도 학사일정</b>을 우선 안내하고 있습니다${period}.</span>${btn}`;
  bar.hidden=false;
  const b=$('#prioGo');if(b)b.onclick=()=>{V.year=+b.dataset.y;render();};
}

/* ============================================================
   3.4 학사일정 검색 : 입력된 모든 학년도의 일정을 이름·분류·날짜로 찾아
      클릭 시 해당 학년도·월력으로 이동 (서버 없이 브라우저에서만 동작)
   ============================================================ */
const TYPE_LBL={hol:'공휴일·휴업일',off:'휴업일',exam:'시험',makeup:'보강',event:'행사',admin:'학사',term:'개강·종강'};
function searchableYears(){
  if(D.lockYear!==false){                 // 연도잠금 시 열람 가능한 학년도만 검색
    const p=priorityInfo();
    return[...new Set([D.year,p&&p.year].filter(y=>y&&YEARS.includes(y)))];
  }
  const ys=YEARS.filter(hasInput);
  return ys.length?ys:(D.year&&YEARS.includes(D.year)?[D.year]:[]);
}
function doSearch(qRaw){
  const q=qRaw.trim().toLowerCase();
  if(!q)return[];
  const out=[];
  searchableYears().forEach(y=>{
    calData(y).items.forEach(it=>{
      const lbl=TYPE_LBL[it.type]||'';
      if(it.name.toLowerCase().includes(q)||lbl.includes(q)||it.s.includes(q)||dlabel(it.s,it.e).includes(q))
        out.push({y,...it});
    });
  });
  out.sort((a,b)=>a.s<b.s?-1:(a.s>b.s?1:0));
  return out.slice(0,40);
}
function jumpTo(y,iso){
  V.year=y;V.view='cal';render();
  closeSearch();
  const d=fromISO(iso);
  const cell=document.querySelector(`#viewCal td[data-iso="${iso}"]`);
  const target=cell||document.getElementById(`m-${d.getFullYear()}-${d.getMonth()+1}`);
  if(target){
    target.scrollIntoView({behavior:'smooth',block:'center'});
    if(cell){cell.classList.add('hl');setTimeout(()=>cell.classList.remove('hl'),2600);}
  }
}
let sResults=[];
function renderSearch(){
  const box=$('#sres'),q=$('#q').value;
  if(!q.trim()){box.hidden=true;return;}
  sResults=doSearch(q);
  box.innerHTML=sResults.length
    ?sResults.map((it,i)=>`<button class="srow" data-i="${i}"><span class="sy">${it.y}학년도</span><span class="sd">${dlabel(it.s,it.e)}</span><span class="snm">${it.name}</span><span class="sk">${TYPE_LBL[it.type]||''}</span></button>`).join('')
    :'<div class="none">— 검색 결과가 없습니다 —</div>';
  box.hidden=false;
  box.querySelectorAll('.srow').forEach(b=>b.onclick=()=>{const it=sResults[+b.dataset.i];jumpTo(it.y,it.s);});
}
function closeSearch(){$('#sres').hidden=true;}
{
  const q=$('#q');
  let deb=null;
  q.oninput=()=>{clearTimeout(deb);deb=setTimeout(renderSearch,120);};
  q.onfocus=()=>{if(q.value.trim())renderSearch();};
  q.onkeydown=e=>{
    if(e.key==='Enter'){renderSearch();if(sResults.length)jumpTo(sResults[0].y,sResults[0].s);}
    else if(e.key==='Escape'){q.blur();closeSearch();}
  };
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbar'))closeSearch();});
}

/* Apps Script 웹앱 호출 (text/plain POST = 사전요청 없이 CORS 허용) */
async function postJSON(url,obj){
  const r=await fetch(url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)});
  const txt=await r.text();
  try{return JSON.parse(txt);}catch(e){}
  /* JSON 대신 구글 오류 페이지(HTML)가 온 경우 — 담당자가 원인을 알 수 있게 본문 일부를 담아 알림 */
  const plain=txt.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  throw new Error('접수 스크립트가 오류 페이지를 돌려주었습니다 (HTTP '+r.status+')'+(plain?' — '+plain.slice(0,150):''));
}

/* 관리자 진입 : 비밀번호 확인 후 생성기로 이동 (탭이 열려 있는 동안 유지)
   비밀번호는 SHA-256 해시로만 비교 — 게시 데이터의 adminPwHash가 있으면 그 값,
   없으면 초기값을 사용 (생성기의 [비밀번호] 버튼에서 변경 → 게시하면 전체 적용) */
const ADMIN_KEY='ac_admin_ok';
const DEFAULT_PW_HASH='6719009a76851c4bed2fcdea10b635c1bd58bf12af0c1fea3a470a87d3ee6995';
async function sha256hex(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function goAdmin(){
  /* 캐시 우회 주소로 이동 — 브라우저가 옛 generator.html을 재사용해 기능이 빠져 보이는 문제 방지 */
  const genUrl=()=>'generator.html?nc='+Date.now();
  try{if(sessionStorage.getItem(ADMIN_KEY)==='1'){location.href=genUrl();return;}}catch(e){}
  const pw=prompt('관리자 비밀번호를 입력하세요');
  if(pw===null)return;
  if(!(window.crypto&&crypto.subtle)){alert('이 기능은 https 환경에서만 사용할 수 있습니다');return;}
  const hash=D.adminPwHash||DEFAULT_PW_HASH;
  let ok=false;
  try{ok=(await sha256hex(pw))===hash;}catch(e){}
  if(ok){
    try{sessionStorage.setItem(ADMIN_KEY,'1');}catch(e){}
    location.href=genUrl();
  }else alert('비밀번호가 올바르지 않습니다');
}

function srcLine(src){
  const upd=D.updated?` · 마지막 수정 <b>${D.updated}</b>`:'';
  const tail=D.lockYear!==false
    ?''
    :' · 연도 목록의 <b>●</b> 표시는 생성기에서 입력된 데이터가 있는 학년도입니다';
  return `데이터 출처 : <b>${src}</b>${upd}${tail}`;
}

/* ============================================================
   5. 관리자 즉시 게시 : 생성기 입력값(localStorage)이 게시본과 다르면
      소유자에게 [지금 게시] 버튼 표시 — 누르면 이 페이지가 데이터를 품은
      새 버전으로 저장되어, 같은 주소의 모든 열람자에게 즉시 반영됩니다.
      (아티팩트 전용 — GitHub Pages 등에서는 data.json 교체 커밋으로 게시)
   ============================================================ */
async function setupPublish(hashData){
  const bar=$('#pubbar');
  const srcData=hashData||readLS();    // 공유 링크로 연 데이터도 게시 가능 (기기·브라우저가 달라도 동작)
  if(!srcData)return;
  if(!(window.claude&&window.claude.use))return;      // 런타임 없는 호스팅(Pages 등)
  const art=await window.claude.use('artifact');
  if(!art)return;                                     // 열람 전용 보기
  const emb=embeddedData();
  const cur=coreOf(srcData);
  if(emb&&JSON.stringify(cur)===JSON.stringify(coreOf(emb)))return;  // 이미 최신
  const what=hashData?'이 공유 링크의 데이터가':'이 브라우저의 생성기 입력값이';
  bar.className='pubbar';
  bar.innerHTML=`<span>${what} 게시본과 다릅니다. 게시하면 이 주소로 접속하는 모든 사람에게 반영됩니다.</span>
    <button id="btnPublish">지금 게시</button>`;
  bar.hidden=false;
  $('#btnPublish').onclick=async()=>{
    const btn=$('#btnPublish');btn.disabled=true;btn.textContent='게시 중…';
    try{
      const res=await fetch(location.pathname+location.search,{cache:'no-store'});
      const html=await res.text();
      const OPEN='<scr'+'ipt id="published-data" type="application/json">';
      const CLOSE='</scr'+'ipt>';
      const i=html.indexOf(OPEN);
      const j=i>=0?html.indexOf(CLOSE,i):-1;
      if(i<0||j<0)throw new Error('데이터 블록을 찾지 못했습니다');
      const payload=JSON.stringify({...cur,updated:todayISO}).replace(/</g,'\\u003c');
      let out=html.slice(0,i+OPEN.length)+payload+html.slice(j);
      if(!/^\s*<!doctype/i.test(out))out='<!doctype html>\n'+out;
      await art.publish(out);
      bar.className='pubbar ok';
      bar.innerHTML='<span>게시 완료 — 모든 열람자에게 반영되었습니다. 화면이 곧 새 버전으로 갱신됩니다.</span>';
    }catch(e){
      if(e&&(e.code==='not_writer'||e.code==='not_granted')){
        bar.hidden=true;                              // 열람 전용 계정
      }else if(e&&e.code==='conflict'){
        bar.className='pubbar ok';                    // 다른 곳에서 먼저 게시됨 → 자동 새로고침됨
        bar.innerHTML='<span>다른 곳에서 먼저 게시되어 최신 버전으로 갱신됩니다.</span>';
      }else{
        bar.className='pubbar err';
        bar.innerHTML=`<span>게시하지 못했습니다 (${e&&e.message?e.message:'알 수 없는 오류'}). 잠시 후 다시 시도해 주세요.</span>
          <button id="btnPublish">다시 시도</button>`;
        $('#btnPublish').onclick=()=>{setupPublish(hashData);};
      }
    }
  };
}

/* 시트 데이터 다시 읽어 화면 갱신 — 실시간 경로 사용, 보던 학년도(V.year)는 유지 */
let lastLoadTs=Date.now();
async function refreshData(){
  lastLoadTs=Date.now();
  const{d,src}=await loadData(true);
  D=d;
  $('#srcline').innerHTML=srcLine(src);
  render();
  setupFeedback();
}
async function manualSync(){
  const b=$('#btnSync');
  if(b){b.disabled=true;b.textContent='동기화 중…';}
  try{await refreshData();}catch(e){}
  finally{if(b){b.disabled=false;b.textContent='↻ 동기화';}}
}

(async()=>{
  const{d,src,hash}=await loadData();
  D=d;
  V.year=initialYear();
  $('#srcline').innerHTML=srcLine(src);
  render();
  setupPublish(hash?d:null);
  setupFeedback();
  const b=$('#btnSync');
  if(b){b.hidden=!!hash;b.onclick=manualSync;}    // 공유 링크 보기에서는 숨김
  /* 첫 화면은 빠른 경로(웹에 게시 CSV)로 띄우되 그 경로는 구글이 최대 5분 늦게 갱신하므로,
     곧바로 지연 없는 경로로 다시 읽어 바뀐 내용(의견수렴 기간·일정 등)이 있으면 갱신한다 */
  if(!hash&&SHEET_ID){
    try{
      const sig=x=>JSON.stringify(coreOf(x))+'|'+(x.submitUrl||'');
      const yearWas=V.year;
      const r=await loadData(true);
      lastLoadTs=Date.now();
      if(r&&r.d&&String(r.src).startsWith('구글시트')&&sig(r.d)!==sig(D)){
        D=r.d;
        if(V.year===yearWas)V.year=initialYear();  // 아직 연도를 바꾸지 않았으면 기본 연도 다시 계산
        $('#srcline').innerHTML=srcLine(r.src);
        render();
        setupFeedback();
      }
    }catch(e){}
  }
})();

/* 탭에 다시 돌아왔을 때 5분 이상 지났으면 자동으로 다시 읽기
   — 열어둔 뷰어에도 승인된 일정 변경이 자동으로 반영되게 한다 */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||decodeShare())return;      // 공유 링크 보기는 그대로 둔다
  if(Date.now()-lastLoadTs<5*60*1000)return;
  refreshData().catch(()=>{});
});
</script>
</body>
</html>
